map $http_x_forwarded_for $overva_forwarded_for {
  default $http_x_forwarded_for;
  "" $remote_addr;
}

map $http_x_forwarded_proto $overva_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 11m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://server.arcgisonline.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://overva-local-demo-api:4100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $overva_forwarded_for;
    proxy_set_header X-Forwarded-Proto $overva_forwarded_proto;
  }

  location /health {
    proxy_pass http://overva-local-demo-api:4100/health;
  }

  location = /service-worker.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location ~* \.(?:js|css)$ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
