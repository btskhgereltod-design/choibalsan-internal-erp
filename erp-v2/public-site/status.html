<!doctype html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OVERVA системийн төлөв</title><style>body{margin:0;font-family:Inter,Segoe UI,sans-serif;background:#071426;color:#fff;min-height:100vh;display:grid;place-items:center}.card{width:min(520px,calc(100% - 48px));padding:36px;border:1px solid #ffffff20;border-radius:22px;background:#ffffff0a}.state{display:flex;gap:12px;align-items:center;margin-top:24px}.dot{width:12px;height:12px;border-radius:50%;background:#eab308}.ok .dot{background:#20b77a}.bad .dot{background:#ef4444}p{color:#b7c8dc}</style></head><body><main class="card"><small>OVERVA PLATFORM</small><h1>Системийн төлөв</h1><p>Энэ шалгалт нь OVERVA API болон үндсэн өгөгдлийн сантай бодитоор холбогдоно.</p><div class="state" id="state"><i class="dot"></i><strong>Шалгаж байна…</strong></div></main><script>fetch('/health',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(x=>{if(!x.ok)throw 0;state.classList.add('ok');state.querySelector('strong').textContent='Үндсэн үйлчилгээ хэвийн байна'}).catch(()=>{state.classList.add('bad');state.querySelector('strong').textContent='Үйлчилгээ доголдолтой байна'})</script></body></html>
